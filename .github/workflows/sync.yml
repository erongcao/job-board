name: 每日同步岗位看板

# 云端调度：与本机是否开着 MiniMax Code、Mac 是否在深度睡眠完全无关。
# 本地 cron 之所以断档，是因为调度器跑在桌面 App 进程里，App 没运行就根本不触发。
on:
  schedule:
    # 临时：每 10 分钟一次，用于验证 GitHub 调度器对本仓库是否生效。
    - cron: "*/10 * * * *"
  workflow_dispatch:        # 手动触发，方便随时验证

permissions:
  contents: write          # 需要推送 commit

concurrency:
  group: job-board-sync
  cancel-in-progress: false   # 不打断正在跑的同步，避免状态文件写坏

jobs:
  sync:
    name: 拉取数据并重建看板
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai        # 让 scan_date / scanned_at 用北京时间
      SKIP_STARTUP: "0"        # 1 = 跳过创业渠道（Wellfound / YC WAA）
      PLAYWRIGHT_BROWSERS_PATH: /opt/hostedtoolcache/playwright

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要历史，用于 rebase
          persist-credentials: true

      - name: 安装 Python 依赖与浏览器
        run: |
          python3 -m pip install --upgrade pip
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: 运行扫描（下载清单 → 解析 → 合并创业渠道 → 渲染看板）
        run: python3 fetch_jobs.py

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add index.html data/history.json data/visa.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "自动同步看板数据：$(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push origin HEAD:main
          fi

      - name: 输出本次统计
        run: |
          python3 - <<'PY'
          import json
          s = json.load(open("data/jobs.json", encoding="utf-8"))
          st = s["stats"]
          print("scan_date:", s["scan_date"])
          print("校招主数据:", st["total"], "| 创业渠道:", st["startup_total"],
                "| 合计:", st["total_all"])
          print("今日新增:", st["new_today"])
          print("按来源:", st.get("by_source"))
          PY
